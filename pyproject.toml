[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drumsynth"
version = "0.2.0"
description = "Spectral modelling for drum hits: fit a compact model to a recording, render it back"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Igor Micadei" }]
keywords = ["audio", "dsp", "stft", "sinusoidal-model", "drums", "audio-compression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]

# numpy only. The transform, the factorizations and the search are all in it;
# scipy is used for one thing (polyphase resampling) and has a fallback.
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# soundfile handles 24-bit, float and compressed WAV variants. Without it the
# stdlib `wave` fallback covers plain PCM only, at 16 bits.
audio = ["soundfile>=0.12"]
# Polyphase resampling. Without it, reading a file at a different rate falls
# back to linear interpolation, which is audibly worse.
resample = ["scipy>=1.10"]
# frontier.png. The fit runs, reports and saves without it.
plots = ["matplotlib>=3.7"]
# The fitting UI: pick a sample, run a search, listen to what came back.
studio = ["streamlit>=1.50", "pandas>=2.0", "soundfile>=0.12", "matplotlib>=3.7"]
dev = [
    "pytest>=7.4",
    "scipy>=1.10",
    "soundfile>=0.12",
    "matplotlib>=3.7",
    "streamlit>=1.50",
    "pandas>=2.0",
]

[project.urls]
Repository = "https://github.com/igormicadei/DrumSynth"

[tool.setuptools.packages.find]
include = ["drumsynth*"]

[project.scripts]
drumsynth = "drumsynth.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
