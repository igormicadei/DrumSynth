[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drumsynth"
version = "0.1.0"
description = "Modal synthesis, scoring and sample handling for membrane drums"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Igor Micadei" }]
keywords = ["audio", "dsp", "modal-synthesis", "drums", "physical-modelling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# soundfile handles 24-bit, float and compressed WAV variants. Without it the
# stdlib `wave` fallback covers plain PCM only.
audio = ["soundfile>=0.12"]
plots = ["matplotlib>=3.7"]
dev = [
    "pytest>=7.4",
    "soundfile>=0.12",
    "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/igormicadei/DrumSynth"

[tool.setuptools.packages.find]
include = ["drumsynth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
