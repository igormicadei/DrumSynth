[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drumsynth"
version = "0.1.0"
description = "Modal synthesis, scoring and sample handling for membrane drums"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Igor Micadei" }]
keywords = ["audio", "dsp", "modal-synthesis", "drums", "physical-modelling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# soundfile handles 24-bit, float and compressed WAV variants. Without it the
# stdlib `wave` fallback covers plain PCM only.
audio = ["soundfile>=0.12"]
plots = ["matplotlib>=3.7"]
# Real-time output. Without it the live engine still runs its `null` sink,
# which drives every meter and the whole command path with no sound card.
live = ["sounddevice>=0.4"]
# The parameter-editing UI.
studio = ["streamlit>=1.50", "pandas>=2.0", "sounddevice>=0.4"]
# Stage 5 of the fit on a GPU. This extra installs whatever wheel the default
# index offers, which on most machines is CPU-only and no faster than numpy.
# For CUDA, install from the matching index instead:
#     pip install torch --index-url https://download.pytorch.org/whl/cu121
# Nothing else in the project imports torch, and the fit runs without it.
cuda = ["torch>=2.0"]
dev = [
    "pytest>=7.4",
    "soundfile>=0.12",
    "matplotlib>=3.7",
    "streamlit>=1.50",
    "pandas>=2.0",
]

[project.urls]
Repository = "https://github.com/igormicadei/DrumSynth"

[tool.setuptools.packages.find]
include = ["drumsynth*"]

[project.scripts]
drumsynth-engine = "drumsynth.live.engine:EngineCLI.main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
